apiVersion: apps/v1
kind: Deployment

metadata:
  name: arrise-web
  namespace: arrise-dev

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: arrise-web

  template:

    metadata:
      labels:
        app: arrise-web

    spec:

      containers:

        - name: nginx

          image: nginx:stable-alpine

          ports:
            - containerPort: 80

          env:

            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: arrise-web-secret
                  key: APP_TOKEN

          volumeMounts:

            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

          resources:

            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:

            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:

        - name: web-content
          configMap:
            name: arrise-web-config